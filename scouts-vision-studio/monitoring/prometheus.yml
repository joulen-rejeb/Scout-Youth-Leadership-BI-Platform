# Prometheus S13 — scrape l’API ML (métriques /metrics).
# Intervalle 15 s (cours : 10–15 s).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scout_ml_api
    metrics_path: /metrics
    static_configs:
      - targets:
          - ml-api:5050
        labels:
          service: scouts-vision-ml
