# Grafana lancé sur l’hôte Windows : Prometheus doit être sur 127.0.0.1:9090
# (npm run prometheus). Même uid « prometheus » que les dashboards JSON.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    uid: prometheus
    editable: false
    jsonData:
      timeInterval: 15s # aligné sur scrape_interval Prometheus (native)
